name: Build and Publish BSV Node

on:
  push:
    branches:
      - main
    paths:
      - "bsv-node/**"
      - ".github/workflows/build-bsv-node.yml"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: deepdance1977/deepbsv-bsv-node
  BSV_VERSION: "1.2.2"

jobs:
  build:
    name: Build BSV Node
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # --------------------------------------------------------
      # Source
      # --------------------------------------------------------

      - name: Checkout DeepBSV
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # QEMU für ARM64
      # --------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # GHCR Login
      # --------------------------------------------------------

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Docker metadata
      # --------------------------------------------------------

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.BSV_VERSION }}
            type=raw,value=latest
            type=sha

      # --------------------------------------------------------
      # Build + Push
      # --------------------------------------------------------

      - name: Build and push BSV Node
        uses: docker/build-push-action@v6
        with:
          context: ./bsv-node
          file: ./bsv-node/Dockerfile

          platforms: |
            linux/amd64
            linux/arm64

          push: true

          build-args: |
            BSV_VERSION=v${{ env.BSV_VERSION }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
