# ============================================================
# Bitcoin SV Mainnet
# DeepBSV integrated node
# ============================================================

server=1
listen=1

# Mainnet
testnet=0
regtest=0

# ------------------------------------------------------------
# RPC
# ------------------------------------------------------------

rpcbind=0.0.0.0
rpcport=8332

# RPC authentication is injected by docker-entrypoint.sh
# from:
#   BITCOIN_RPC_USER
#   BITCOIN_RPC_PASSWORD

# Nur internes Docker-Netzwerk für RPC zulassen.
rpcallowip=172.16.0.0/12
rpcallowip=10.0.0.0/8

# ------------------------------------------------------------
# P2P
# ------------------------------------------------------------

port=8333

# ------------------------------------------------------------
# Data
# ------------------------------------------------------------

datadir=/data

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

printtoconsole=1

# ------------------------------------------------------------
# BSV configuration
# ------------------------------------------------------------

excessiveblocksize=1000000000
maxstackmemoryusageconsensus=100000000

# ------------------------------------------------------------
# ZMQ
# ------------------------------------------------------------

zmqpubhashblock=tcp://0.0.0.0:28332
zmqpubhashtx=tcp://0.0.0.0:28333
