version: '3.8'

services:
  api:
    build: .
    container_name: deepbsv-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - deepbsv-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepbsv-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - deepbsv-net

networks:
  deepbsv-net:
    driver: bridge
