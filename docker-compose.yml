version: '3.8'

services:
  api:
    build: .
    image: deepbsv_api:latest
    container_name: ${APP_ID}_api_server
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deepbsv_frontend:latest
    container_name: ${APP_ID}_web_server
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    depends_on:
      - api
    networks:
      - default

networks:
  default:
    ipam:
      driver: default
