name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest-timeout ruff mypy

      - name: Run ruff check
        run: ruff check .

      - name: Run mypy
        run: mypy src

      - name: Run pytest with timeout
        run: pytest --timeout=30 -v
