version: "3.8"

services:

  # ------------------------------------------------------------
  # DeepBSV Web Dashboard
  # ------------------------------------------------------------
  # Muss bei 5tratumOS der erste echte Web-Service bleiben.
  frontend:
    image: ghcr.io/deepdance1977/deepbsv-frontend:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default

  # ------------------------------------------------------------
  # 5tratumOS / Umbrel App Proxy
  # ------------------------------------------------------------
  app_proxy:
    environment:
      APP_HOST: deepdance-deepbsv_frontend_1
      APP_PORT: 80

  # ------------------------------------------------------------
  # DeepBSV API / Mining Core
  # ------------------------------------------------------------
  api:
    image: ghcr.io/deepdance1977/deepbsv-api:latest
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 1m

    environment:
      PYTHONUNBUFFERED: "1"

      # --------------------------------------------------------
      # Verbindung zum integrierten Bitcoin-SV-Node
      # --------------------------------------------------------
      BSV_RPC_HOST: bsv-node
      BSV_RPC_PORT: "8332"
      BSV_RPC_USER: deepbsv
      BSV_RPC_PASSWORD: deepbsv-internal

    depends_on:
      - bsv-node

    ports:
      # DeepBSV API
      - "8000:8000"

      # Stratum V1 für ASIC-Miner
      - "3333:3333"

    networks:
      - default

  # ------------------------------------------------------------
  # Bitcoin SV Mainnet Node
  # ------------------------------------------------------------
  bsv-node:
    image: ghcr.io/deepdance1977/deepbsv-bsv-node:1.2.2
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 5m

    environment:
      # --------------------------------------------------------
      # RPC
      # --------------------------------------------------------
      BITCOIN_RPC_USER: deepbsv
      BITCOIN_RPC_PASSWORD: deepbsv-internal

      # --------------------------------------------------------
      # Persistenter Blockchain-Speicher
      # --------------------------------------------------------
      BITCOIN_DATA: /data

    volumes:
      # Die BSV-Blockchain bleibt über Neustarts/Updates erhalten.
      - bsv_data:/data

    ports:
      # Bitcoin SV Mainnet P2P
      - "8333:8333"

    expose:
      # RPC nur innerhalb des Docker-Netzwerks.
      - "8332"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bitcoin-cli -rpcconnect=127.0.0.1 -rpcport=8332 -rpcuser=deepbsv -rpcpassword=deepbsv-internal getblockchaininfo >/dev/null 2>&1"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

    networks:
      - default


# ------------------------------------------------------------
# Persistenter Speicher
# ------------------------------------------------------------
volumes:
  bsv_data:


# ------------------------------------------------------------
# Internes Docker-Netzwerk
# ------------------------------------------------------------
networks:
  default:
    ipam:
      driver: default
